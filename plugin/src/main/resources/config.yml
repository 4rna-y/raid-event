# クレートの種類に依らない追加報酬。クレートの pool / featured の相対抽選とは別枠で、
# レイド成功のたびに 1 エントリずつ独立に判定する。当たったものは報酬チェストに入る。
# 書き方は crates のロットと同じ (custom / item / min / max / enchants / potion) で、
# weight の代わりに chance を使う。
#   chance:    排出率 (0 より大きく 1 以下)
#   min-level: このレベル未満のレイドでは判定しない (既定 1)
# 追加報酬はクレートの中身より先にスロットを取る。合わせて 27 を超えるときに削られるのは
# クレートの側。
extra-drops:
  # モディファイアを選び直せる。アンカーが要らないのでレベルを問わない
  - {custom: modifier_reset_ticket, chance: 0.08}
  # リコールスクロール 3 種。アンカーが無いと使えないので低レベルでは出さない
  - {custom: recall_scroll, min: 1, max: 2, chance: 0.30, min-level: 3}
  - {custom: spatial_recall_scroll, chance: 0.15, min-level: 4}
  - {custom: emergency_recall_scroll, chance: 0.10, min-level: 5}

# 報酬クレート。チェスト1個 (27スロット)。slots の範囲でスロット数を決め、
# 各スロットを pool から重み付きで独立に抽選する (重複あり)。
# featured があるレベルでは、まず featured から1スロット確定で選ぶ (L4 以上の目玉枠)。
# custom: 特別なアイテム (dimensional_chest / sniper_rifle / explosive_bow / modifier_revival /
#         modifier_reset_ticket / recall_scroll / spatial_recall_scroll / emergency_recall_scroll)。
#         振る舞いは relics / Modifier / manchor が持つ。
# エリトラ・ネザースター・メイスは出さない (エンドシティ・ウィザー・トライアルチャンバーのもの)。
# ポーションは potion にバニラの PotionType 名を書く (strong_* / long_* も可)。
