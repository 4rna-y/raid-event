# プラグインを有効にするか。false なら何もしない。
enabled: true

# メッセージの接頭辞 (MiniMessage 形式)。
message-prefix: "<gray>[<gold>RaidEvent<gray>]</gray> "

# レイドの生成と進行。
raid:
  # マインクラフト時間の1日ごとに、この確率でレイドを1つ抽選する。
  # 当たったら、その日の中のランダムな時刻に発生する。固定時刻で判定すると
  # 昼か夜のどちらかに偏るので、時刻もここで散らしている。
  daily-chance: 0.2

  # 地図配布から失効までの時間 (tick)。マインクラフト時間の半日 = 12000。
  expire-ticks: 12000

  # 地点 p にこの距離 (ブロック) まで近づくとウェーブが始まる。
  trigger-radius: 16

  # 生成地点はプレイヤーからこの距離 (ブロック) の環状帯から選ぶ。
  min-distance: 200
  max-distance: 600

  # ウェーブの人数スケールに数える半径。ウェーブ開始のたびに測り直す。
  participant-radius: 48

  # ウェーブ全滅から次ウェーブ開始までの間隔 (tick)。立て直しの猶予。
  wave-interval-ticks: 160

  # 発生・失効・接近・放棄を見る間隔 (tick)。
  check-period-ticks: 20

  # 開始後、この半径 (ブロック) 内に参加者が誰も居ない状態が下の時間 (tick) 続いたら
  # 放棄とみなしてキャンセルする。チャンクごとアンロードされてモンスターの
  # デスポーンを観測できない場合の保険。
  abandon-radius: 96
  abandon-ticks: 2400

# ゲーム進行度スコア。オンラインのサバイバルプレイヤー (オーバーワールド在圏) の
# 平均スコアから基礎ティアを決める。昼レイドは基礎ティアそのまま (上限4)、
# 夜レイドは +1 (最大5)。つまり Tier 5 は夜にしか発生しない。
score:
  # このスコア以上で基礎ティアが T2 / T3 / T4 になる。
  tier-thresholds: [10, 19, 28]
  # ワールド経過日数によるスコア: この日数ごとに +1。
  days-per-point: 5
  # 日数で足せる上限。
  days-max-points: 6

# ティアごとのウェーブ構成と強化倍率。
# モブの数は「参加者2人」基準。ウェーブ開始時に participant-radius 内の人数 n で
# ×(1 + 0.4×(n-2)) にスケールする (1人なら ×0.6、端数切り上げ)。
# クリーパー (爆発+地形破壊) とラヴェジャー (ノックバック事故) は、死=ワールド消滅の
# サーバーでは一撃事故の元なので使わない (パース時に拒否される)。
# 弓・クロスボウ持ち (スケルトン+ピリジャー) は各ウェーブ4体まで (これもパース時に検査)。
tiers:
  "1":
    attributes: {health: 1.0, damage: 1.0, speed: 1.0}
    waves:
      - mobs:
          - {type: zombie, count: 3}
          - {type: skeleton, count: 1, weapon: bow}
      - mobs:
          - {type: zombie, count: 2}
          - {type: skeleton, count: 2, weapon: bow}
  "2":
    attributes: {health: 1.0, damage: 1.0, speed: 1.0}
    waves:
      - mobs:
          - {type: zombie, count: 3}
          - {type: skeleton, count: 2, weapon: bow}
      - mobs:
          - {type: zombie, count: 3}
          - {type: spider, count: 2}
      - mobs:
          - {type: zombie, count: 2, helmet: golden_helmet, weapon: golden_sword}
          - {type: skeleton, count: 2, weapon: bow}
  "3":
    attributes: {health: 1.2, damage: 1.0, speed: 1.0}
    waves:
      - mobs:
          - {type: zombie, count: 4}
          - {type: skeleton, count: 2, weapon: bow}
      - mobs:
          - {type: pillager, count: 2, weapon: crossbow}
          - {type: zombie, count: 3}
          - {type: spider, count: 1}
      - mobs:
          - {type: vindicator, count: 1, weapon: iron_axe}
          - {type: pillager, count: 2, weapon: crossbow}
          - {type: witch, count: 1}
          - {type: zombie, count: 2, helmet: iron_helmet}
  "4":
    attributes: {health: 1.5, damage: 1.0, speed: 1.1}
    waves:
      - mobs:
          - {type: zombie, count: 4, helmet: iron_helmet}
          - {type: skeleton, count: 2, weapon: bow}
      - mobs:
          - {type: pillager, count: 3, weapon: crossbow}
