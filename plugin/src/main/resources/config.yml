          - {type: skeleton, count: 3, weapon: bow, weapon-enchants: {power: 1}}
          - {type: zombie, count: 2}
          - {type: zombie, count: 1, baby: true}
      - mobs:
          - {type: vindicator, count: 2, weapon: iron_axe}
          - {type: pillager, count: 3, weapon: crossbow}
